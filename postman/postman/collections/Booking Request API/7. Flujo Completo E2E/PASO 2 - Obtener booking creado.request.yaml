$kind: http-request
url: "{{base_url}}/api/bookings/{{booking_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Supplier presente', () => pm.expect(pm.response.json().supplier).to.not.be.null);
    language: text/javascript
order: 2000
