$kind: http-request
url: "{{base_url}}/api/bookings/{{booking_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Tiene supplier', () => pm.expect(pm.response.json().supplier).to.not.be.null);
      pm.test('Tiene items', () => pm.expect(pm.response.json().items.length).to.be.above(0));
    language: text/javascript
order: 1000
